<title>مراجعة لغتي – الصف السادس</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1c2b3a;--mut:#5a6b7b;--p:#1f4e8c;--a:#e8a317;--ok:#1b8a5a;--no:#d64545;--line:#dbe3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a26;--card:#182535;--ink:#eaf1f8;--mut:#9db0c3;--p:#6fa8e8;--line:#2a3b4f}}
:root[data-theme="dark"]{--bg:#101a26;--card:#182535;--ink:#eaf1f8;--mut:#9db0c3;--p:#6fa8e8;--line:#2a3b4f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;min-height:100vh}
.w{max-width:760px;margin:0 auto;padding:16px}
header{text-align:center;padding:26px 12px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#1f4e8c,#2b7a78);animation:fd .7s}
header h1{margin:0;font-size:2rem}header p{margin:6px 0 0;opacity:.95}
.tag{display:inline-block;background:var(--a);color:#222;border-radius:20px;padding:2px 14px;margin-top:10px;font-weight:700}
.grid{display:grid;gap:12px;margin-top:16px}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 14px #0001}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;color:#fff;background:var(--p);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-3px)}.btn.alt{background:var(--a);color:#222}
.sec{cursor:pointer;text-align:center;font-size:1.2rem;font-weight:700;transition:transform .2s;animation:fd .6s}
.sec:hover{transform:scale(1.04)}.sec span{display:block;font-size:2.2rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.top button{width:auto;padding:8px 14px}
.stat{display:flex;gap:14px;font-weight:700;color:var(--p)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.q{font-size:1.25rem;font-weight:700;margin:14px 0;animation:fd .4s}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--p);transform:translateX(-4px)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}
.opt.no{background:var(--no);color:#fff;border-color:var(--no);animation:shk .4s}
.exp{background:#fff7e0;color:#4a3a05;border-radius:14px;padding:12px;border-right:5px solid var(--a)}
.big{font-size:3rem;text-align:center}
.fb{min-height:1.8em;font-weight:700;text-align:center}
@keyframes fd{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shk{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
.cf{position:fixed;top:-20px;width:10px;height:14px;animation:fall 2.4s linear forwards;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.lvs .btn{font-size:.95rem}.meta{font-size:.85rem;color:var(--mut);margin-top:4px}.rv{background:var(--bg);border:2px dashed var(--p);border-radius:12px;padding:12px;margin-top:10px;animation:fd .4s;white-space:pre-wrap}body{padding-bottom:84px}#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--a);font-weight:700}#bar .nm{color:var(--p);font-size:1.05rem}#bar button{border:0;border-radius:10px;padding:5px 10px;font:inherit;background:var(--p);color:#fff;cursor:pointer;margin-inline-start:4px}.mb{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.mc{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:380px;animation:fd .3s}.mc input{width:100%;padding:10px;margin:6px 0;border:2px solid var(--line);border-radius:10px;font:inherit;text-align:center;background:var(--bg);color:var(--ink);letter-spacing:6px}.mc textarea{width:100%;height:180px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:8px}</style>
</head>

function secs(k){var s=D[k],h='<header><h1>📚 مراجعة لغتي – الصف السادس</h1><p>مسابقة تفاعلية تضم بنك الأسئلة كاملاً</p><span class="tag">أ / مصطفى نصّار</span><div style="margin-top:8px"><a href="https://wa.me/966582455921" target="_blank" rel="noopener" style="color:#fff;font-weight:700;text-decoration:none">📱 واتساب: <bdi dir="ltr">0582455921</bdi></a></div></header><div class="top"><span class="meta">'+s.ic+' '+s.n+'</span><button class="btn alt" onclick="mute=!mute;this.textContent=mute?\'🔇\':\'🔊\'">'+(mute?"🔇":"🔊")+'</button></div><div class="grid">';s.L.forEach(function(l,n){h+='<div class="card sec" style="text-align:right;font-size:1.05rem" onclick="lesson(\''+k+'\','+n+')"><b>'+(n+1)+'. '+esc(l.t)+'</b><div class="meta">'+l.q.length+' سؤالاً</div></div>'});h+='<button class="btn alt" onclick="runAll(\''+k+'\')">🏆 المسابقة الشاملة (25 سؤالاً عشوائياً)</button></div>';A.innerHTML=h}
function lesson(k,n){var l=D[k].L[n],c=[0,0,0];l.q.forEach(function(q){c[q.l]++});var h=head("secs('"+k+"')")+'<div class="card"><h2>'+esc(l.t)+'</h2><div class="exp">'+esc(l.e)+'</div><div class="lvs"><button class="btn alt" style="grid-column:1/3" onclick="run(\''+k+'\','+n+',-1)">كل المستويات ('+l.q.length+')</button>';for(var x=0;x<3;x++)h+='<button class="btn" '+(x==2?'style="grid-column:1/3" ':'')+'onclick="run(\''+k+'\','+n+','+x+')">'+LN[x]+' ('+c[x]+')</button>';A.innerHTML=h+'</div></div>'}
function run(k,n,lv){var l=D[k].L[n];qs=sh(l.q.filter(function(q){return lv<0||q.l==lv}).map(function(q){q.t=l.t;return q}));start("lesson('"+k+"',"+n+")")}
function runAll(k){var a=[];D[k].L.forEach(function(l){l.q.forEach(function(q){q.t=l.t;a.push(q)})});qs=sh(a).slice(0,25);start("secs('"+k+"')")}
function start(b){sc=0;st=0;i=0;best=0;bk=b;show()}
function show(){var q=qs[i],h=head(bk)+'<div class="card"><div class="top"><div class="stat"><span>⭐ '+sc+'</span><span>🔥 '+st+'</span></div><span>'+(i+1)+' / '+qs.length+'</span></div><div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div><div class="meta">'+esc(q.t)+' — '+LN[q.l]+'</div>'+(admin?'<button class="btn alt" style="margin:8px 0" onclick="delQ()">🗑 حذف هذا السؤال</button>':'')+'<div class="q">'+esc(q.q)+'</div>';
if(q.y=="rv"){h+='<button class="btn" id="rb">أظهر الإجابة 👀</button><div id="rx"></div>'}
else{var o=q.y=="tf"?["✓ صح","✗ خطأ"]:q.o,ord=q.y=="tf"?[0,1]:sh(o.map(function(t,x){return x}));ord.forEach(function(x){h+='<button class="opt" data-x="'+x+'">'+esc(o[x])+'</button>'})}
h+='<div class="fb" id="fb"></div></div>';A.innerHTML=h;
if(q.y=="rv"){document.getElementById("rb").onclick=reveal}else A.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){ans(b)}})}
function reveal(){var q=qs[i];document.getElementById("rb").style.display="none";document.getElementById("rx").innerHTML='<div class="rv"><b>الإجابة النموذجية:</b><br>'+esc(q.a)+'</div><div class="lvs"><button class="btn" id="y1">✅ أجبتُ صحيحاً</button><button class="btn alt" id="y0">❌ سأراجعها</button></div>';
document.getElementById("y1").onclick=function(){mark(true)};document.getElementById("y0").onclick=function(){mark(false)}}
function mark(ok){if(ok){st++;best=Math.max(best,st);sc+=10+Math.min(st,5)*2;good()}else{st=0;bad()}i++;i<qs.length?show():end()}
function ans(b){var q=qs[i],x=+b.dataset.x,all=A.querySelectorAll(".opt"),fb=document.getElementById("fb");all.forEach(function(o){o.onclick=null});
var right=x===q.a,txt=q.y=="tf"?(q.a==0?"صح":"خطأ")+(q.x?" — "+q.x:""):q.o[q.a];
if(right){b.classList.add("ok");st++;best=Math.max(best,st);sc+=10+Math.min(st,5)*2;good();fb.textContent="أحسنت! 🎉"+(q.y=="tf"&&q.x?" "+q.x:"")}
else{b.classList.add("no");st=0;bad();all.forEach(function(o){if(+o.dataset.x===q.a)o.classList.add("ok")});fb.textContent="الإجابة الصحيحة: "+txt+" 💡"}
setTimeout(function(){i++;i<qs.length?show():end()},right?1200:2400)}
function end(){var pc=sc/(qs.length*20),s=pc>.7?3:pc>.45?2:1;win();if(s>1)confetti();
A.innerHTML=head(bk)+'<div class="card"><div class="big">'+"⭐".repeat(s)+'</div><h2 style="text-align:center">انتهى التحدي!</h2><p style="text-align:center">نقاطك: <b>'+sc+'</b> — أطول سلسلة صحيحة: <b>'+best+'</b></p><button class="btn" onclick="'+bk+'">اختر تحدياً آخر</button></div>'}
home();bar();
</script>
